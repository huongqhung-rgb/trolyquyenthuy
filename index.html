<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý Quyên</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#7b2d6b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trợ lý Quyên"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcf4f8;--card:#fff;--ink:#2a1630;--mut:#765f82;--line:#efdbe7;--rail:#b03a86;--on:#fff;--red:#b92f26;--grn:#27795a;--amb:#b7791f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1124;--card:#27192f;--ink:#f6e9f1;--mut:#b9a3c0;--line:#3d2a48;--rail:#f08ab5;--on:#2a1630;--red:#ef7a70;--grn:#4fc088;--amb:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1124;--card:#27192f;--ink:#f6e9f1;--mut:#b9a3c0;--line:#3d2a48;--rail:#f08ab5;--on:#2a1630;--red:#ef7a70;--grn:#4fc088;--amb:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif}
#app{max-width:520px;margin:auto;padding:16px 16px 100px}
h1{font-size:21px;margin:0;line-height:1.25}h2{font-size:16px;margin:20px 0 8px}p{margin:6px 0}
.mut{color:var(--mut)}.err{color:var(--red);min-height:1.2em}
.hd{display:flex;align-items:center;gap:12px}.hd>div{flex:1}
.av{width:42px;height:42px;border-radius:50%;background:var(--rail);color:var(--on);display:grid;place-items:center;font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rail);outline-offset:2px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px}
.pri{background:var(--rail);color:var(--on);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.ghost{background:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.week,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week{margin:16px 0;padding-bottom:10px;border-bottom:3px dashed var(--line)}
.day{border:0;background:none;color:var(--ink);padding:7px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:50px}
.day small{color:var(--mut);font-size:11px}.day b{font-size:16px}
.day.on{background:var(--rail);color:var(--on)}.day.on small{color:var(--on)}.day.td b{text-decoration:underline}.day.out{opacity:.35}
.day i{width:5px;height:5px;border-radius:50%;background:var(--amb);position:absolute;bottom:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task{display:flex;align-items:center;gap:10px}.task input{width:22px;height:22px;accent-color:var(--grn);flex:none}
.tb{flex:1;min-width:0}.tb small{display:block;color:var(--mut)}.tb a{color:var(--rail)}.done .tb b{text-decoration:line-through;color:var(--mut)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.x{border:0;background:none;color:var(--mut);font-size:22px;padding:0 4px}
.ring{display:flex;align-items:center;gap:16px}.ring b{font-size:18px}
.qa{display:flex;gap:6px;margin:12px 0}.qa input{flex:1}
.bn{border-left:4px solid var(--amb)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px}.chip.on{background:var(--rail);color:var(--on);border-color:var(--rail)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{columns:2;gap:8px}.grid .card{break-inside:avoid}.grid pre{white-space:pre-wrap;font:inherit;margin:4px 0 0;color:var(--mut)}
.pie{width:110px;height:110px;border-radius:50%;flex:none}.lg{display:flex;align-items:center;gap:6px;font-size:13px}.lg i{width:10px;height:10px;border-radius:2px}
.hb{display:flex;gap:4px;margin-top:8px}.hb button{flex:1;border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:6px 0;font-size:12px}.hb .ok{background:var(--grn);color:#fff;border-color:var(--grn)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--rail);color:var(--on);font-size:28px;box-shadow:0 4px 14px #0004;z-index:4}
nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:none;color:var(--mut);font-size:11px;padding:4px;display:flex;flex-direction:column;align-items:center}nav span{font-size:20px}nav .on{color:var(--rail);font-weight:600}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;max-height:90%;overflow:auto}
.sheet h3{margin:0 0 12px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
input[type=checkbox]{width:auto;margin-right:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:20;display:none;max-width:90%}
.hero{background:linear-gradient(155deg,#7b2d6b,#12698a 62%,#1b8a8f);color:#fff;margin:-16px -16px 18px;padding:18px 16px 20px;border-radius:0 0 30px 30px}
.hero .card{color:var(--ink)}.hero .mut{color:rgba(255,255,255,.85)}
.hero .av,.hero .pri{background:#ffd3e4;color:#5a1745}
.hero .ib,.hero input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.hero ::placeholder{color:rgba(255,255,255,.75)}
.hero .day,.hero .day small{color:#fff}.hero .day small{opacity:.75}.hero .day.on{background:#fff;color:#7b2d6b}.hero .day.on small{color:#7b2d6b;opacity:1}
.hero .week{border-bottom-color:rgba(255,255,255,.35)}.hero h1{font-size:19px}
.hero .ring circle:nth-child(2){animation:fill 1s ease-out}@keyframes fill{from{stroke-dashoffset:214}}
@media(prefers-reduced-motion:reduce){.hero .ring circle:nth-child(2){animation:none}}
#view>h1,#view>.bar:first-child{background:linear-gradient(155deg,#7b2d6b,#1b8a8f);color:#fff;margin:-16px -16px 14px;padding:18px 16px 20px;border-radius:0 0 26px 26px}
#view>.bar:first-child .ib{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.card{border-radius:18px;box-shadow:0 1px 2px #14202b10,0 8px 20px #14202b0d}
.task{border-left-width:5px;border-left-color:var(--c,var(--line))}
.tag{background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.chip{padding:6px 14px}.pie{box-shadow:inset 0 0 0 1px var(--line)}
.fab{background:#ffb3cf;color:#4a1a36;box-shadow:0 8px 22px #e0589b55;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 20px #14202b14}
nav .on span{background:color-mix(in srgb,var(--rail) 18%,transparent);border-radius:14px;padding:0 16px}
.hero,#view>h1,#view>.bar:first-child{background:linear-gradient(155deg,var(--g1,#7b2d6b),var(--g2,#1b8a8f))}
.pri{background:var(--g2,var(--rail));color:#fff}.chip.on{background:var(--g2);border-color:var(--g2);color:#fff}
.day.on{background:var(--g2);color:#fff}
nav .on{color:var(--g2)}nav .on span{background:color-mix(in srgb,var(--g2) 18%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:10px 12px;text-align:left;color:var(--ink);box-shadow:0 8px 20px #14202b0d}.tile b{display:block;font-size:20px;color:var(--c);line-height:1.2}.tile small{color:var(--mut)}
.shine{background:linear-gradient(90deg,#fff,#ffc2dd,#ffe0b8,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 5s linear infinite}@keyframes shn{to{background-position:-300% 0}}
.mq{overflow:hidden;white-space:nowrap;margin:10px 0 0;font-size:13px;color:#fff;opacity:.92}.mq span{display:inline-block;padding-left:100%;animation:mq 26s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.shine,.mq span{animation:none}.mq span{padding-left:0}}
.cg .day{min-height:66px;justify-content:flex-start}.cg .day small.lu{font-size:9px;opacity:.75}.cg .day small.ev{font-size:8px;line-height:1.1;color:var(--red);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cg .day.on small{color:#fff}
.ncard{border-top:5px solid var(--c)}.bdg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--c)}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px}.bars i{flex:1;background:var(--c);border-radius:3px 3px 0 0;min-height:2px}
.hero{position:relative;overflow:hidden;border-radius:0 0 44px 44px}
.hero>*:not(.petals){position:relative;z-index:1}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-24px;width:11px;height:15px;background:rgba(255,255,255,.5);border-radius:70% 0 70% 0;animation:fall 10s linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(22px,150px) rotate(180deg)}100%{transform:translate(-8px,320px) rotate(360deg);opacity:.1}}
.hero h1.shine{font-family:'Dancing Script','Be Vietnam Pro',cursive;font-size:27px;line-height:1.25}
#view>h1{font-family:'Dancing Script','Be Vietnam Pro',cursive;font-size:30px}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.tile{animation:up .45s ease both;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--c) 14%,var(--card)));border-radius:22px}
button{transition:transform .15s,box-shadow .2s}button:active{transform:scale(.96)}
.card{border-radius:22px;box-shadow:0 2px 4px #b03a8614,0 10px 24px #b03a860f}
nav{left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:28px;border:1px solid var(--line);padding-bottom:6px}
#app{padding-bottom:120px}
@media(prefers-reduced-motion:reduce){.petals i,.tile{animation:none}}

</style></head><body>
<div id="app"><div id="view"></div></div>
<button class="fab" id="fab" onclick="add()" aria-label="Thêm mới">+</button>
<nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<script>
const K='trolyquyen_v1',V='trolyquyen_vault';
const $=s=>document.querySelector(s);
let S={name:'chị Quyên',theme:'',cyc:[],sym:[],water:{},beauty:{steps:[],log:{}},goals:[],hl:[],ann:[],trips:[],wfav:[],wmy:[],tasks:[],notes:[],fin:[],habits:[],ppl:[],seeded:0};
try{const r=localStorage.getItem(K);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}widgetSync();schedNotif()};
function CP(){return(window.Capacitor&&window.Capacitor.Plugins)||{}}
function widgetSync(){try{const P=CP().Preferences;if(!P)return;P.set({key:'top3',value:JSON.stringify(evs(today()).filter(t=>!t.done).slice(0,3).map(t=>(t.h?t.h+' ':'')+t.t))})}catch(e){}}
const BK=()=>JSON.stringify({S,V:(()=>{try{return localStorage.getItem(V)}catch(e){return null}})()});
let _sn;function schedNotif(){clearTimeout(_sn);_sn=setTimeout(async()=>{try{const L=CP().LocalNotifications;if(!L)return;
const pr=await L.checkPermissions();if(pr.display!=='granted'){const r=await L.requestPermissions();if(r.display!=='granted')return}
const pend=await L.getPending();if(pend.notifications.length)await L.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
const now=Date.now(),out=[],hid=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
S.tasks.forEach(t=>{if(t.done)return;const at=new Date(t.d+'T'+(t.h||'08:00')).getTime()-(t.rem||15)*6e4;if(at>now)out.push({id:hid(t.id),title:'Sắp tới: '+t.t,body:(t.h||'')+(t.place?' tại '+t.place:''),schedule:{at:new Date(at),allowWhileIdle:true}})});
S.ppl.forEach(p=>{if(!p.bd)return;for(let i=0;i<60;i++){const d=addD(new Date(),i);if(ymd(d).slice(5)===p.bd.slice(5)){const at=new Date(ymd(addD(d,-1))+'T08:00').getTime();if(at>now)out.push({id:hid('b'+p.id),title:'Ngày mai là sinh nhật '+p.n,body:p.co||'Gửi lời chúc?',schedule:{at:new Date(at),allowWhileIdle:true}});break}}});
if(out.length)await L.schedule({notifications:out.slice(0,60)})}catch(e){}},800)}
async function bioUnlock(){try{const n=CP().NativeBiometric;await n.verifyIdentity({reason:'Mở két sắt',title:'Xác thực'});const c=await n.getCredentials({server:'trolyhung'});if(await vOpen(c.password))render()}catch(e){toast('Không xác thực được, hãy dùng PIN')}}
async function bioSave(pin){try{const n=CP().NativeBiometric;if(n&&(await n.isAvailable()).isAvailable)await n.setCredentials({username:'vault',password:pin,server:'trolyhung'})}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date()),WD=['CN','T2','T3','T4','T5','T6','T7'];
const vn=d=>d.split('-').reverse().join('/');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TY={kc:['Khẩn cấp','var(--red)'],cv:['Công tác','var(--rail)'],cn:['Cá nhân','var(--grn)'],gd:['Gia đình','#d6568f']};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫';
let tab='home',sel=today(),calM=new Date(),calMode='m',filt='all',folder='',q='',sub='habit',vKey=null,vSalt=null,vData=[];
if(!S.seeded){S.seeded=1;const t=today();S.tasks.push(
{id:uid(),t:'Lên kế hoạch cho tuần mới',d:t,h:'08:30',type:'cv',rem:15,note:'Việc mẫu, có thể xóa'},
{id:uid(),t:'Hoàn thành việc quan trọng nhất trong ngày',d:t,h:'14:00',type:'kc',rem:15,note:'Việc mẫu, có thể xóa'},
{id:uid(),t:'Đi bộ thư giãn 30 phút',d:t,h:'18:00',type:'cn',rem:5,note:'Việc mẫu, có thể xóa'});save()}
function theme(){document.documentElement.dataset.theme=S.theme||''}theme();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ---- dữ liệu & tự động hóa ---- */
const bdOn=d=>S.ppl.filter(p=>p.bd&&p.bd.slice(5)===d.slice(5)).map(p=>({id:'b'+p.id,t:'Sinh nhật '+p.n+(p.co?' ('+p.co+')':''),d,h:'',type:'cn',bd:1,done:false}));
const evs=d=>[...S.tasks.filter(t=>t.d<=d&&(t.d2||t.d)>=d),...bdOn(d)].sort((a,b)=>(a.h||'99').localeCompare(b.h||'99'));
const tripFor=d=>S.tasks.find(t=>t.type==='cv'&&t.d2&&t.d<=d&&t.d2>=d);
function addTask(o){const t={id:uid(),done:false,type:'cn',rem:15,...o};S.tasks.push(t);
 if(t.type==='cv'&&t.d2&&t.d2>t.d)S.notes.push({id:uid(),title:'Biên bản công tác: '+t.t+' ('+vn(t.d)+')',folder:'Công tác',body:'',d:t.d}); /* Luồng 1 */
 save();try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}return t}
function parse(s){let d=new Date(),h='';const l=s.toLowerCase(),R=/(\d{1,2})\s*(?:h|giờ|:)\s*(\d{1,2})?\s*(sáng|trưa|chiều|tối)?/i;
 if(/ngày mai|\bmai\b/.test(l))d=addD(d,1);else if(/ngày kia/.test(l))d=addD(d,2);
 const m=s.match(R);if(m){let H=+m[1];const p=(m[3]||'').toLowerCase();if((p==='chiều'||p==='tối')&&H<12)H+=12;if(p==='trưa'&&H<11)H+=12;h=pad(H)+':'+pad(m[2]?+m[2]:0)}
 const pl=s.match(/(?:tại|ở)\s+(.+)$/i);
 const t=s.replace(/(?:tại|ở)\s+.+$/i,'').replace(R,'').replace(/ngày mai|\bmai\b|ngày kia|\blúc\b/ig,'').replace(/^\s*(lên lịch( cho anh)?|nhắc( anh)?)\s*/i,'').replace(/\s+/g,' ').trim();
 return{t:t||s,d:ymd(d),h,place:pl?pl[1].trim():'',type:/họp|công tác|báo cáo|giao ban|kế hoạch/i.test(s)?'cv':/gia đình|đón|nấu|chợ|ba mẹ|bố mẹ|chồng|con /i.test(s)?'gd':'cn'}}
const fired={};
function remind(){try{if(Notification.permission!=='granted')return;const n=new Date();S.tasks.forEach(t=>{if(t.done||fired[t.id])return;const df=(new Date(t.d+'T'+(t.h||'08:00'))-n)/6e4;if(df<=t.rem&&df>-1){fired[t.id]=1;new Notification('Sắp tới: '+t.t,{body:(t.h||'')+(t.place?' tại '+t.place:'')})}})}catch(e){}}
setInterval(remind,30000);

/* ---- form dùng chung ---- */
function form(title,fields,ok){$('#modal').innerHTML='<div class="sheet"><h3>'+title+'</h3><div id="ff">'+fields.map(f=>'<label>'+f.l+(f.t==='textarea'?'<textarea name="'+f.k+'" rows="5" placeholder="'+esc(f.p)+'">'+esc(f.v)+'</textarea>':f.t==='select'?'<select name="'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]==f.v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':'<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(f.v)+'" placeholder="'+esc(f.p)+'" '+(f.t==='number'?'inputmode="numeric"':'')+'>')+'</label>').join('')+'</div><div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="pri" onclick="subm()">Lưu</button></div></div>';
 $('#modal').classList.add('on');window._ok=ok}
function subm(){const o={};document.querySelectorAll('#ff [name]').forEach(e=>o[e.name]=e.type==='checkbox'?e.checked:e.value);if(window._ok(o)!==false)closeM()}
const closeM=()=>$('#modal').classList.remove('on');
/* ---- âm lịch (thuật toán Hồ Ngọc Đức, múi giờ +7) ---- */
const INT=Math.floor;function jdn(d,m,y){const a=INT((14-m)/12),Y=y+4800-a,M=m+12*a-3;return d+INT((153*M+2)/5)+365*Y+INT(Y/4)-INT(Y/100)+INT(Y/400)-32045}

/* ---- két sắt mã hóa AES-GCM, khóa từ PIN ---- */
const enc=new TextEncoder(),dec=new TextDecoder(),b64=u=>btoa(String.fromCharCode(...u)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(pin,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vSave(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},vKey,enc.encode(JSON.stringify(vData))));try{localStorage.setItem(V,JSON.stringify({s:b64(vSalt),d:b64([...iv,...ct])}))}catch(e){toast('Không lưu được két')}}
const hasV=()=>{try{return !!localStorage.getItem(V)}catch(e){return false}};
async function vOpen(pin){const r=hasV()?JSON.parse(localStorage.getItem(V)):null;
 if(!r){vSalt=crypto.getRandomValues(new Uint8Array(16));vKey=await dk(pin,vSalt);vData=[];await vSave();return true}
 vSalt=ub(r.s);const k=await dk(pin,vSalt),raw=ub(r.d);
 try{vData=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12))));vKey=k;return true}catch(e){return false}}
function unlock(){const p=$('#pin').value;if(!/^\d{6}$/.test(p))return $('#pe').textContent='PIN gồm đúng 6 chữ số';vOpen(p).then(ok=>{if(ok){bioSave(p);render()}else $('#pe').textContent='Sai PIN'})}

function fin0(){
 const mk=today().slice(0,7),L=S.fin.filter(f=>f.d.startsWith(mk)),tot=L.reduce((a,f)=>a+f.amt,0),by={},trip={},cols=['#1f4e79','#c8372d','#2f8f5b','#b7791f','#7a5aa6','#66727d'];
 L.forEach(f=>by[f.cat]=(by[f.cat]||0)+f.amt);S.fin.filter(f=>f.trip).forEach(f=>trip[f.trip]=(trip[f.trip]||0)+f.amt);

function cyc(){const i=cycInfo(),D=x=>new Date(x+'T00:00');let h='<h1>Chu k\u1ef3</h1>'+subChips()+'<p class="mut">C\u00f4ng c\u1ee5 theo d\u00f5i v\u00e0 \u01b0\u1edbc t\u00ednh, kh\u00f4ng thay th\u1ebf b\u00e1c s\u0129 v\u00e0 kh\u00f4ng d\u00f9ng l\u00e0m bi\u1ec7n ph\u00e1p tr\u00e1nh thai. D\u1eef li\u1ec7u ch\u1ec9 l\u01b0u trong \u0111i\u1ec7n tho\u1ea1i c\u1ee7a ch\u1ecb.</p>'+`<div class="chips"><button class="chip on" onclick="cycStart()">B\u1eaft \u0111\u1ea7u k\u1ef3 kinh h\u00f4m nay</button><button class="chip" onclick="cycEnd()">K\u1ebft th\u00fac k\u1ef3 kinh h\u00f4m nay</button><button class="chip" onclick="symForm({})">Ghi tri\u1ec7u ch\u1ee9ng</button></div>`;
 if(!i)return h+empty('Ch\u01b0a c\u00f3 d\u1eef li\u1ec7u. B\u1ea5m "B\u1eaft \u0111\u1ea7u k\u1ef3 kinh h\u00f4m nay" khi c\u00f3 k\u1ef3 kinh \u0111\u1ec3 app b\u1eaft \u0111\u1ea7u d\u1ef1 \u0111o\u00e1n.');
 const P=PH[i.phase],pct=Math.min(100,Math.round(i.day/i.len*100));
 h+=`<div class="card" style="border-top:5px solid ${P[1]}"><span class="bdg" style="--c:${P[1]}">${P[0]}</span><p style="font-size:18px;margin:8px 0 2px"><b>Ng\u00e0y th\u1ee9 ${i.day}</b> c\u1ee7a chu k\u1ef3 (trung b\u00ecnh ${i.len} ng\u00e0y)</p><div style="height:10px;background:var(--line);border-radius:8px;margin:8px 0"><div style="height:10px;width:${pct}%;background:${P[1]};border-radius:8px"></div></div><p>K\u1ef3 kinh ti\u1ebfp theo d\u1ef1 ki\u1ebfn: <b>${vn(i.next)}</b> (${i.toNext>=0?'c\u00f2n '+i.toNext+' ng\u00e0y':'tr\u1ec5 '+(-i.toNext)+' ng\u00e0y'})</p><p class="mut">R\u1ee5ng tr\u1ee9ng \u01b0\u1edbc t\u00ednh: ${vn(ymd(addD(D(i.last.s),i.ov-1)))}. K\u1ef3 kinh trung b\u00ecnh ${i.per} ng\u00e0y.</p><p>${P[2]}</p></div>`;
 const AL=[];if(i.irreg)AL.push('C\u00f3 chu k\u1ef3 ng\u1eafn h\u01a1n 21 ho\u1eb7c d\u00e0i h\u01a1n 35 ng\u00e0y.');if(i.C.some(c=>c.e&&Math.round((D(c.e)-D(c.s))/864e5)+1>7))AL.push('C\u00f3 k\u1ef3 kinh k\u00e9o d\u00e0i h\u01a1n 7 ng\u00e0y.');if(i.toNext<-7&&i.phase!=='kinh')AL.push('Ch\u1eadm h\u01a1n 7 ng\u00e0y so v\u1edbi d\u1ef1 ki\u1ebfn.');
 if(AL.length)h+=`<div class="card" style="border-left:5px solid var(--red)"><b>N\u00ean theo d\u00f5i v\u00e0 trao \u0111\u1ed5i v\u1edbi b\u00e1c s\u0129</b>${AL.map(x=>'<p>'+x+'</p>').join('')}</div>`;
 h+='<h2>L\u1ecbch s\u1eed k\u1ef3 kinh</h2>'+i.C.slice().reverse().slice(0,8).map(c=>`<div class="card bar"><b style="cursor:pointer" onclick="editC('${c.id}')">${vn(c.s)}${c.e?' \u0111\u1ebfn '+vn(c.e):' (\u0111ang di\u1ec5n ra)'}</b><button class="x" onclick="del('cyc','${c.id}')" aria-label="X\u00f3a">\u00d7</button></div>`).join('');
 h+='<h2>Tri\u1ec7u ch\u1ee9ng g\u1ea7n \u0111\u00e2y</h2>'+(S.sym.length?S.sym.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8).map(x=>`<div class="card bar"><span><b style="cursor:pointer" onclick="editS('${x.id}')">${vn(x.d)}</b><small class="mut" style="display:block">${['Kh\u00f4ng \u0111au','\u0110au nh\u1eb9','\u0110au v\u1eeba','\u0110au nhi\u1ec1u'][+x.pain||0]}${x.flow?', m\u00e1u '+['','\u00edt','v\u1eeba','nhi\u1ec1u'][+x.flow]:''}${x.mood?', '+esc(x.mood):''}${x.note?', '+esc(x.note):''}</small></span><button class="x" onclick="del('sym','${x.id}')" aria-label="X\u00f3a">\u00d7</button></div>`).join(''):empty('Ch\u01b0a ghi tri\u1ec7u ch\u1ee9ng.'));
 return h+`<h2>Kh\u00e1m v\u00e0 t\u1ea7m so\u00e1t \u0111\u1ecbnh k\u1ef3</h2><div class="card"><p>Kh\u00e1m ph\u1ee5 khoa \u0111\u1ecbnh k\u1ef3 kho\u1ea3ng 6 \u0111\u1ebfn 12 th\u00e1ng m\u1ed9t l\u1ea7n. T\u1ea7m so\u00e1t ung th\u01b0 c\u1ed5 t\u1eed cung v\u00e0 ung th\u01b0 v\u00fa (x\u00e9t nghi\u1ec7m, si\u00eau \u00e2m, nh\u0169 \u1ea3nh) theo \u0111\u1ed9 tu\u1ed5i v\u00e0 ch\u1ec9 \u0111\u1ecbnh c\u1ee7a b\u00e1c s\u0129. Ti\u00eam ph\u00f2ng HPV theo t\u01b0 v\u1ea5n y t\u1ebf.</p><button class="ghost" onclick="taskForm({t:'Kh\u00e1m ph\u1ee5 khoa \u0111\u1ecbnh k\u1ef3',d:ymd(addD(new Date(),30)),type:'gd',rem:1440})">\u0110\u1eb7t l\u1ecbch nh\u1eafc \u0111i kh\u00e1m</button> <button class="ghost" onclick="taskForm({t:'T\u1ef1 theo d\u00f5i v\u00fa, ph\u00e1t hi\u1ec7n b\u1ea5t th\u01b0\u1eddng',d:ymd(addD(new Date(),30)),type:'gd',rem:60})">Nh\u1eafc theo d\u00f5i v\u00fa h\u1eb1ng th\u00e1ng</button></div>`}
/* l\u00e0m \u0111\u1eb9p, n\u01b0\u1edbc u\u1ed1ng */
const wat=n=>{const t=today();S.water[t]=Math.max(0,(S.water[t]||0)+n);save();render()};
function stepTog(id){const t=today(),l=S.beauty.log[t]=S.beauty.log[t]||[],k=l.indexOf(id);k<0?l.push(id):l.splice(k,1);save();render()}
function stepDel(id){S.beauty.steps=S.beauty.steps.filter(x=>x.id!==id);save();render()}
function stepForm(){form('B\u01b0\u1edbc d\u01b0\u1ee1ng m\u1edbi',[{k:'n',l:'T\u00ean b\u01b0\u1edbc (serum vitamin C, m\u1eb7t n\u1ea1\u2026)'},{k:'w',l:'Th\u1eddi \u0111i\u1ec3m',t:'select',o:[['s','Bu\u1ed5i s\u00e1ng'],['t','Bu\u1ed5i t\u1ed1i'],['w','H\u1eb1ng tu\u1ea7n']]}],o=>{if(!o.n.trim())return false;S.beauty.steps.push({id:uid(),...o});save();render()})}
function beauty(){const B=S.beauty;if(!B.steps.length)B.steps=[['s','R\u1eeda m\u1eb7t s\u1ea1ch'],['s','Kem ch\u1ed1ng n\u1eafng SPF 30 tr\u1edf l\u00ean'],['t','T\u1ea9y trang'],['t','R\u1eeda m\u1eb7t v\u00e0 d\u01b0\u1ee1ng \u1ea9m'],['w','T\u1ea9y t\u1ebf b\u00e0o ch\u1ebft nh\u1eb9 (1 \u0111\u1ebfn 2 l\u1ea7n/tu\u1ea7n)'],['w','\u0110\u1eafp m\u1eb7t n\u1ea1 d\u01b0\u1ee1ng']].map(x=>({id:uid(),w:x[0],n:x[1]}));
 const td=today(),lg=B.log[td]||[],wt=S.water[td]||0,G={s:'Bu\u1ed5i s\u00e1ng',t:'Bu\u1ed5i t\u1ed1i',w:'H\u1eb1ng tu\u1ea7n'},dn=B.steps.filter(s=>s.w!=='w'&&lg.includes(s.id)).length,tt=B.steps.filter(s=>s.w!=='w').length;
 return `<h1>L\u00e0m \u0111\u1eb9p</h1>${subChips()}<div class="card ring" style="border-top:5px solid #1a8f80"><div style="font-size:34px" aria-hidden="true">\ud83d\udca7</div><div><b>N\u01b0\u1edbc h\u00f4m nay: ${wt}/8 ly</b><p class="mut">M\u1ed1c tham kh\u1ea3o kho\u1ea3ng 2 l\u00edt/ng\u00e0y, \u0111i\u1ec1u ch\u1ec9nh theo c\u01a1 th\u1ec3 v\u00e0 th\u1eddi ti\u1ebft.</p><div class="chips"><button class="chip on" onclick="wat(1)">+1 ly</button><button class="chip" onclick="wat(-1)">-1 ly</button></div></div></div><p class="mut">H\u00f4m nay \u0111\u00e3 xong ${dn}/${tt} b\u01b0\u1edbc s\u00e1ng v\u00e0 t\u1ed1i.</p>`+['s','t','w'].map(g=>`<h2>${G[g]}</h2>`+B.steps.filter(s=>s.w===g).map(s=>`<div class="card task" style="--c:var(--g2)"><input type="checkbox" ${lg.includes(s.id)?'checked':''} onchange="stepTog('${s.id}')" aria-label="Ho\u00e0n th\u00e0nh"><div class="tb"><b>${esc(s.n)}</b></div><button class="x" onclick="stepDel('${s.id}')" aria-label="X\u00f3a">\u00d7</button></div>`).join('')).join('')+'<div class="card"><b>G\u1ee3i \u00fd chung</b><p class="mut">Ch\u1ed1ng n\u1eafng ph\u1ed5 r\u1ed9ng SPF 30 tr\u1edf l\u00ean m\u1ed7i s\u00e1ng, b\u00f4i l\u1ea1i kho\u1ea3ng 2 gi\u1edd m\u1ed9t l\u1ea7n khi \u1edf ngo\u00e0i n\u1eafng. Ng\u1ee7 7 \u0111\u1ebfn 9 gi\u1edd, \u0103n nhi\u1ec1u rau qu\u1ea3. Da n\u1ed5i m\u1ea9n k\u00e9o d\u00e0i ho\u1eb7c n\u1ed1t ru\u1ed3i thay \u0111\u1ed5i b\u1ea5t th\u01b0\u1eddng c\u1ea7n \u0111i kh\u00e1m da li\u1ec5u.</p></div>'}

const TABS=[['home','🏠','Hôm nay'],['cal','📅','Lịch'],['note','📝','Ghi chú'],['vault','🔐','Két sắt'],['fin','💰','Chi tiêu'],['more','🎯','Khác']];
function render(){colors();$('#view').innerHTML={home,cal,note,vault,fin,more}[tab]();
 $('#nav').innerHTML=TABS.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>').join('');
 $('#fab').style.display=(tab==='vault'&&!vKey)?'none':'block'}
render();schedNotif();widgetSync();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
